name: Release candidate artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed candidate version
        required: true
        type: string

permissions: {}
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package and attest RC
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Require reviewed candidate tag and manifest
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          EXPECTED_REF: refs/tags/v1.0.0-rc.1
        run: |
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$REQUESTED_VERSION" = '1.0.0-rc.1'
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/entergy_mobile/manifest.json').read_text())
          assert manifest['version'] == '1.0.0-rc.1'
          assert manifest['requirements'] == []
          PY
      - name: Build deterministic archive and checksum
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/ha-entergy-1.0.0-rc.1.zip HEAD custom_components/entergy_mobile
          cd dist
          sha256sum ha-entergy-1.0.0-rc.1.zip > ha-entergy-1.0.0-rc.1.zip.sha256
          sha256sum --check ha-entergy-1.0.0-rc.1.zip.sha256
          python - <<'PY'
          import re
          import subprocess
          import zipfile
          from pathlib import Path
          name = 'ha-entergy-1.0.0-rc.1.zip'
          line = Path(name + '.sha256').read_text()
          assert re.fullmatch(r'[0-9a-f]{64}  ' + re.escape(name) + r'\n', line)
          expected = set(subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', 'HEAD', 'custom_components/entergy_mobile'], cwd='..', text=True).splitlines())
          with zipfile.ZipFile(name) as archive:
              members = archive.namelist()
              files = {item for item in members if not item.endswith('/')}
              assert files == expected
              assert all(item.startswith('custom_components/entergy_mobile/') or item in ('custom_components/', 'custom_components/entergy_mobile/') for item in members)
          PY
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/ha-entergy-1.0.0-rc.1.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ha-entergy-1.0.0-rc.1
          path: |
            dist/ha-entergy-1.0.0-rc.1.zip
            dist/ha-entergy-1.0.0-rc.1.zip.sha256
          if-no-files-found: error
